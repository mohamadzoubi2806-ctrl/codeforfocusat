<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Focus target circles -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>

  <!-- Center target -->
  <circle cx="50" cy="50" r="16" fill="url(#targetGrad)"/>

  <!-- Pencil/arrow pointing to center (representing focus and learning) -->
  <g transform="translate(50, 20) rotate(45 0 0)">
    <!-- Pencil body -->
    <rect x="-3" y="0" width="6" height="22" fill="#f97316" rx="1"/>
    <!-- Pencil tip -->
    <path d="M -3 22 L 0 28 L 3 22 Z" fill="#ea580c"/>
    <!-- Pencil eraser -->
    <rect x="-3.5" y="-3" width="7" height="3" fill="#ec4899" rx="1"/>
  </g>

  <!-- Small sparkle elements for creativity -->
  <circle cx="72" cy="28" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="28" cy="72" r="2" fill="#fbbf24" opacity="0.8"/>
  <path d="M 78 70 L 79 73 L 82 74 L 79 75 L 78 78 L 77 75 L 74 74 L 77 73 Z" fill="#fbbf24" opacity="0.9"/>
</svg>
